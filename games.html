<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games • Warp</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="brand">WARP</div>

    <div class="nav-links">
        <a href="/" class="nav-btn">Home</a>
        <a href="/games.html" class="nav-btn active">Games</a>
    </div>

    <a href="/" class="nav-play">← Home</a>
</nav>


<main class="games-page">

    <div class="games-header">

        <div class="status">
            <span></span>
            WARP GAMES
        </div>

        <h1>Game Library</h1>

        <p>Find something to play.</p>

    </div>


    <div class="games-tools">

        <input
            id="search"
            type="text"
            placeholder="Search games..."
            autocomplete="off"
        >

        <div class="categories">
            <button class="category active" data-category="all">All</button>
            <button class="category" data-category="popular">🔥 Popular</button>
            <button class="category" data-category="sports">Sports</button>
            <button class="category" data-category="action">Action</button>
            <button class="category" data-category="puzzle">Puzzle</button>
            <button class="category" data-category="strategy">Strategy</button>
        </div>

    </div>


    <div class="library-info">
        <span id="game-count">0</span> games available
    </div>


    <div id="games"></div>

    <div id="no-results">
        No games found.
    </div>

</main>


<footer>
    WARP GAMES © 2026
</footer>

<script src="script.js"></script>

</body>
</html>
